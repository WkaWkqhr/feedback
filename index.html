<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLASS FEEDBACK</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">CLASS FEEDBACK</h1>
    <button id="loginOpen" class="btn ghost">관리자 로그인</button>
    <button id="logoutBtn" class="btn ghost hidden">로그아웃</button>
  </header>

  <main>
    <!-- 학생 화면 -->
    <section id="studentView" class="card">
      <h2 class="question">오늘 수업은 어땠나요?</h2>
      <div class="vote-buttons">
        <button class="vote" data-rating="satisfied"><span class="emoji">😊</span>만족</button>
        <button class="vote" data-rating="neutral"><span class="emoji">😐</span>보통</button>
        <button class="vote" data-rating="dissatisfied"><span class="emoji">😞</span>불만족</button>
      </div>
      <p id="voteMsg" class="msg" role="status"></p>
    </section>

    <!-- 관리자 로그인 -->
    <section id="loginView" class="card hidden">
      <h2>관리자 로그인</h2>
      <form id="loginForm" class="form">
        <input id="email" type="email" placeholder="이메일" autocomplete="username" required>
        <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" required>
        <button type="submit" class="btn primary">로그인</button>
        <button type="button" id="loginCancel" class="btn ghost">취소</button>
      </form>
      <p id="loginMsg" class="msg error" role="alert"></p>
    </section>

    <!-- 관리자 화면 -->
    <section id="adminView" class="card hidden">
      <h2>수업 만족도 결과</h2>
      <p class="total">전체 투표 수 <strong id="total">0</strong></p>
      <div class="results">
        <div class="row" data-rating="satisfied">
          <div class="label">😊 만족 <span class="stat">0표 (0%)</span></div>
          <div class="bar"><div class="fill"></div></div>
        </div>
        <div class="row" data-rating="neutral">
          <div class="label">😐 보통 <span class="stat">0표 (0%)</span></div>
          <div class="bar"><div class="fill"></div></div>
        </div>
        <div class="row" data-rating="dissatisfied">
          <div class="label">😞 불만족 <span class="stat">0표 (0%)</span></div>
          <div class="bar"><div class="fill"></div></div>
        </div>
      </div>
      <div class="actions">
        <button id="refreshBtn" class="btn primary">결과 새로고침</button>
        <button id="resetBtn" class="btn danger">투표 결과 초기화</button>
      </div>
      <p id="adminMsg" class="msg" role="status"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
